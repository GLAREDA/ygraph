name: Windows Build

on:
  push:
    branches: [ "main", "master", "interactive-viz" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        dir: '${{ github.workspace }}/qt/'
        install-deps: 'true'
        cache: 'true'

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build
      run: |
        qmake CONFIG+=release
        nmake

    - name: Deploy (Find and Package)
      shell: powershell
      run: |
        # Создаем папку dist
        New-Item -ItemType Directory -Force -Path dist
        
        # 1. Ищем .exe файл рекурсивно во всех папках (кроме самой dist)
        # Мы берем первый попавшийся exe, который был создан только что
        $exeFile = Get-ChildItem -Path . -Filter *.exe -Recurse | Where-Object { $_.DirectoryName -notmatch "dist" -and $_.Name -notmatch "qmake" } | Select-Object -First 1
        
        if ($exeFile) {
            Write-Host "FOUND EXE: $($exeFile.FullName)"
            Copy-Item $exeFile.FullName -Destination dist\
        } else {
            Write-Error "CRITICAL: .exe file not found after build!"
            # Выводим список всех файлов, чтобы понять, что пошло не так (для отладки)
            Get-ChildItem -Recurse
            exit 1
        }
        
        # 2. Запускаем windeployqt
        windeployqt --release --compiler-runtime dist\*.exe
        
        # 3. Удаляем лишние файлы (obj, cpp, h), если они случайно попали, оставляем только exe и dll
        Get-ChildItem -Path dist -Recurse | Where-Object { $_.Extension -in ".obj", ".cpp", ".h", ".exp", ".lib" } | Remove-Item

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GraphEditor-Windows
        path: dist/
