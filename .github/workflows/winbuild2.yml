name: Windows Build

on:
  push:
    branches: [ "main", "master", "fixed-edges", "ini-config" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        dir: '${{ github.workspace }}/qt/'
        install-deps: 'true'
        cache: 'true'

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build
      run: |
        qmake "CONFIG+=release"
        nmake

    - name: Deploy (Strict Search)
      shell: powershell
      run: |
        # Создаем папку dist
        New-Item -ItemType Directory -Force -Path dist
        
        Write-Host "--- SEARCHING FOR EXE ---"
        
        # 1. СТРОГИЙ ПОИСК: Ищем только в папке 'release'.
        # Это стандартное место, куда qmake кладет exe файл.
        $exeFile = Get-ChildItem -Path "release" -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        
        # 2. ЗАПАСНОЙ ВАРИАНТ: Ищем в корне, но БЕЗ рекурсии (-MaxDepth 1).
        # Это гарантирует, что мы не залезем в папку qt/ и не найдем мусор.
        if (-not $exeFile) {
            Write-Host "Not found in 'release'. Checking root folder..."
            $exeFile = Get-ChildItem -Path "." -Filter *.exe -MaxDepth 1 | Where-Object { $_.Name -notmatch "qmake" } | Select-Object -First 1
        }

        if ($exeFile) {
            Write-Host "SUCCESS: Found exe at $($exeFile.FullName)"
            
            # Копируем ваш Lastversion.exe в папку dist
            Copy-Item $exeFile.FullName -Destination dist\
            
            # Определяем новый путь
            $destExe = "dist\$($exeFile.Name)"
            
            # Запускаем windeployqt для этого конкретного файла
            Write-Host "Running windeployqt..."
            windeployqt --release --compiler-runtime --no-translations $destExe
            
            # Удаляем мусор, который мог скопироваться
            Get-ChildItem -Path dist -Recurse | Where-Object { $_.Extension -in ".obj", ".cpp", ".h", ".exp", ".lib", ".ilk", ".pdb" } | Remove-Item
            
        } else {
            Write-Error "BUILD ERROR: Could not find Lastversion.exe (or any other .exe)!"
            
            # Вывод содержимого для отладки, если снова не найдет
            Write-Host "Content of 'release' folder:"
            Get-ChildItem -Path "release" -ErrorAction SilentlyContinue
            
            Write-Host "Content of root folder:"
            Get-ChildItem -Path "." -MaxDepth 1
            
            exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GraphEditor-Windows
        path: dist/
